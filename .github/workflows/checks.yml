name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: machinarc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:disposable-ci-only@localhost:5432/machinarc_ci_app
      TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@localhost:5432/machinarc_test
      MARC_WORKER: off
      MARC_ENCRYPTION_KEY: disposable-ci-encryption-key-not-for-production
      PGPASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Prepare disposable integration database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0000_canonical_schema.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/0001_shared_rate_limits.sql
      - run: npm run test:integration
      - run: npm run build
